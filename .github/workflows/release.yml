name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: Stamp version and upload assets
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stamp version
        run: |
          version=${GITHUB_REF_NAME#v}
          sed -i "s/^VERSION=\".*\"$/VERSION=\"$version\"/" bin/git-worktree-share
          test "$(bash bin/git-worktree-share --version)" = "git-worktree-share $version"

      - name: Test
        run: make test

      - name: Commit version and move tag
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "release ${GITHUB_REF_NAME}"
          git tag -f "$GITHUB_REF_NAME"
          git push -f origin "refs/tags/$GITHUB_REF_NAME"

      - name: Archive
        run: tar -czf git-worktree-share.tar.gz bin/git-worktree-share LICENSE README.md Makefile

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" git-worktree-share.tar.gz bin/git-worktree-share --clobber

      - name: Commit version to default branch
        run: |
          branch="${{ github.event.repository.default_branch }}"
          git push origin "HEAD:$branch" && exit 0
          git fetch origin "$branch"
          git checkout -f -B version-bump FETCH_HEAD
          sed -i "s/^VERSION=\".*\"$/VERSION=\"${GITHUB_REF_NAME#v}\"/" bin/git-worktree-share
          git diff --quiet && exit 0
          git commit -am "release ${GITHUB_REF_NAME}"
          git push origin "HEAD:$branch"
